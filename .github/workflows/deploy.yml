name: Deploy to GitHub Pages

# Publishing is deliberate, never automatic: this repository is public, so a
# deploy puts the catalog's records — steward names, contact addresses and
# storage paths — on the open web. Run it from Actions -> Deploy to GitHub Pages
# -> Run workflow when you actually want the site (re)published. Add
#   push:
#     branches: [main]
# back here to return to deploying on every merge to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
