name: Deploy to GitHub Pages

# Every merge to main republishes the site. workflow_dispatch also allows a
# manual run against any branch, which is how a branch gets previewed before
# it is merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: a CARTO basemap key, stored as a repository secret
          # (Settings -> Secrets and variables -> Actions). Without it the site
          # builds against OpenFreeMap, which needs no key. Either way the value
          # ends up in the published JavaScript — every browser-side map key
          # does — so restrict it to this site's domain in the CARTO dashboard.
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
